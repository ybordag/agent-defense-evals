[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-defense-evals"
version = "0.1.0"
description = "Open-weight evaluation harnesses for multi-agent AI security defenses"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Yashila Bordag" }]
dependencies = [
    "pydantic>=2.9,<3",
    "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "ruff>=0.9,<1",
]
local-model = [
    "accelerate>=1,<2",
    "safetensors>=0.4,<1",
    "torch>=2.5,<3",
    "transformers>=4.48,<6",
]

[project.scripts]
agent-defense-evals = "agent_defense_evals.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
