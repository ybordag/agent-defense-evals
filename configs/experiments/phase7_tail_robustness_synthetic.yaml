experiment_id: phase7-tail-robustness-synthetic-v1
evidence_scope: controlled_synthetic
base_seed: 73001
episodes_per_cell: 40
tail_fraction: 0.10
confidence_delta: 0.05
utility_floor: 0.75
false_alarm_ceiling: 0.10
latency_ceiling_ms: 100.0
practical_margin: 0.05

stacks:
