    kind: control
    components: [observe_only]
    utility: 1.0
    latency_ms: 1.0
  - stack_id: message-single
    kind: single
    components: [message_monitor_a]
    utility: 0.96
    latency_ms: 12.0
  - stack_id: message-ensemble
    kind: homogeneous
    components: [message_monitor_a, message_monitor_b, message_monitor_c]
    utility: 0.89
    latency_ms: 38.0
  - stack_id: diverse-pair
    kind: diverse
    components: [message_monitor_a, capacity_mediator]
    utility: 0.90
    latency_ms: 42.0
  - stack_id: diverse-stack
    kind: diverse
    components: [sequential_monitor, capacity_mediator, provenance_gate, action_gate]
    utility: 0.82
    latency_ms: 78.0

