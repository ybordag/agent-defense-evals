schema_version: "0.1.0"
experiment_id: scripted-baseline
base_seed: 20260820
max_steps: 4

agents:
  - agent_id: analyst
    role: constraint-holder
    policy:
      kind: constraint_sharer
      config:
        coordinator: false
  - agent_id: coordinator
    role: decision-maker
    policy:
      kind: constraint_sharer
      config:
        coordinator: true

scenario:
  kind: distributed_choice
  config:
    coordinator_id: coordinator
    plans:
      - plan_id: alpha
        score: 10.0
      - plan_id: beta
        score: 8.0
      - plan_id: gamma
        score: 6.0
    private_allowed:
      analyst: [alpha, beta]
      coordinator: [beta, gamma]

attack:
  kind: none
  config: {}

defenses: []

dimensions:
  detectability_target: 1.0
  coalition_size: 0
  cascade_branching: 0.0
  composition_depth: 2
  horizon: 2
  attribution_degradation: 0.0
  directness: none
  reversibility: 1.0

capture:
  events: true
  activations: false
